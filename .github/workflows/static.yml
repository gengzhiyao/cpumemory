  # Deploy GitBook's prebuilt _book folder to GitHub Pages
  name: Deploy static content to Pages

  on:
    push:
      branches: ["master"]   # 如果你的默认分支是 main，就改成 main
    workflow_dispatch:

  permissions:
    contents: read
    pages: write
    id-token: write

  concurrency:
    group: "pages"
    cancel-in-progress: false

  jobs:
    deploy:
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
        - name: Setup Pages
          uses: actions/configure-pages@v5
        - name: Upload artifact
          uses: actions/upload-pages-artifact@v3
          with:
            path: '_book'   # 只发布已生成的静态网站
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4
